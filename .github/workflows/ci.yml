name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verify Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('cmd/mdl/webapp/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build UI (with caching)
        run: |
          make build-ui

      - name: Depend (install goimports and golangci-lint)
        run: |
          make depend

      - name: Go mod cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Lint
        run: |
          make lint

      - name: Test
        env:
          CHROME_BIN: google-chrome
        run: |
          make test


