name: Run Static Checks and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install lint dependencies
        run: make depend

      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Build UI
        run: make build-ui

      - name: Test UI
        working-directory: cmd/mdl/webapp
        run: pnpm test

      - name: Type check UI
        working-directory: cmd/mdl/webapp
        run: pnpm exec tsc --noEmit

      - name: Test Go and browser behavior
        env:
          CHROME_BIN: google-chrome
        run: make test
