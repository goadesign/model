name: Run Static Checks and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Build UI
        run: make build-ui

      - name: Install lint dependencies
        run: make depend

      - name: Lint
        run: make lint

  test:
    name: Test
    strategy:
      fail-fast: true
      matrix:
        go: ['1.26']
        os: ['ubuntu-latest']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install dependencies
        run: go mod download

      - name: Build UI
        run: make build-ui

      - name: Build
        run: |
          cd cmd/mdl && go build
          cd ../stz && go build

      - name: Run tests
        run: make test
